<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fundo Deep Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Gradiente Bio-Lime para Orbital Cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#deff9a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base / Container com Cantos Arredondados -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#deff9a" stroke-width="1.8" stroke-opacity="0.35" />

  <!-- Anel de Órbita Elíptica -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="3 2" transform="rotate(-28 32 32)" />

  <!-- Ícone Satélite Estilizado OrbiMed -->
  <g transform="translate(14, 14)" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Painel Solar Esquerdo -->
    <polygon points="4,10 10,4 16,10 10,16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="7" y1="7" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Haste Conectora Esquerda -->
    <line x1="13" y1="13" x2="16" y2="16" stroke="#deff9a" stroke-width="2" />

    <!-- Corpo Central do Satélite (Módulo Cúbico) -->
    <rect x="15" y="15" width="10" height="10" rx="2.5" fill="#05070a" stroke="#deff9a" stroke-width="2.2" />

    <!-- Símbolo da Cruz Médica no Centro do Satélite -->
    <line x1="20" y1="17.5" x2="20" y2="22.5" stroke="#deff9a" stroke-width="1.6" />
    <line x1="17.5" y1="20" x2="22.5" y2="20" stroke="#deff9a" stroke-width="1.6" />

    <!-- Haste Conectora Direita -->
    <line x1="24" y1="24" x2="27" y2="27" stroke="#deff9a" stroke-width="2" />

    <!-- Painel Solar Direito -->
    <polygon points="24,30 30,24 36,30 30,36" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="27" y1="27" x2="33" y2="33" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Ondas de Sinal de Telemetria / Enlace Orbital -->
    <path d="M7 26 A 11 11 0 0 0 14 33" stroke="#deff9a" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <path d="M4 29 A 16 16 0 0 0 13 38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="9" cy="24" r="1.2" fill="#deff9a" />
  </g>
</svg>
