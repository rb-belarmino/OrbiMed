<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbiMed — Simulador Móvel iPhone 15 Pro</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Tailwind Theme Script -->
  <script src="js/tailwind.config.js"></script>

  <!-- Folhas de Estilos Externas -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/mobile-prototype.css">
</head>

<body
  class="bg-space-950 text-white min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans selection:bg-bio-lime selection:text-space-950">

  <!-- Chassi Simulador iPhone 15 Pro -->
  <div class="iphone-frame">
    <!-- Dynamic Island Animada -->
    <div id="dynamicIsland" class="dynamic-island">
      <div id="dynamicIslandContent" class="w-full flex items-center justify-between text-xs">
        <div class="w-2.5 h-2.5 rounded-full bg-bio-lime/80"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-gray-800 border border-white/20"></div>
      </div>
    </div>

    <!-- Status Bar iOS -->
    <div class="ios-status-bar">
      <span id="mobileTimeDisplay" class="font-mono">14:32</span>
      <div class="flex items-center gap-1.5 text-xs">
        <i data-lucide="signal" class="w-3.5 h-3.5"></i>
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <div class="flex items-center">
          <div class="w-5 h-2.5 rounded-sm border border-white/80 p-0.5 flex items-center">
            <div class="h-full w-full bg-bio-lime rounded-2xs"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification Flutuante -->
    <div id="mobileToast"
      class="absolute top-16 left-6 right-6 z-50 bg-space-850/95 border border-bio-lime/40 text-white text-[11px] font-mono px-3 py-2 rounded-xl text-center shadow-lg transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none">
      Notificação
    </div>

    <!-- Conteúdo Dinâmico das 5 Telas -->
    <main id="mobileScreenContent" class="mobile-screen"></main>

    <!-- Barra de Navegação Inferior iOS -->
    <nav class="bg-space-950/90 border-t border-white/10 px-6 py-2 flex items-center justify-between z-40">
      <button onclick="navigateToScreen(1)"
        class="flex flex-col items-center gap-1 text-[10px] font-mono text-bio-lime focus:outline-none">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>Triagem</span>
      </button>
      <button onclick="navigateToScreen(2)"
        class="flex flex-col items-center gap-1 text-[10px] font-mono text-gray-400 hover:text-white focus:outline-none">
        <i data-lucide="clipboard-list" class="w-4 h-4"></i>
        <span>Ficha</span>
      </button>
      <button onclick="navigateToScreen(3)"
        class="flex flex-col items-center gap-1 text-[10px] font-mono text-gray-400 hover:text-white focus:outline-none">
        <i data-lucide="cpu" class="w-4 h-4"></i>
        <span>Edge AI</span>
      </button>
      <button onclick="navigateToScreen(4)"
        class="flex flex-col items-center gap-1 text-[10px] font-mono text-gray-400 hover:text-white focus:outline-none">
        <i data-lucide="satellite" class="w-4 h-4"></i>
        <span>Uplink</span>
      </button>
      <button onclick="navigateToScreen(5)"
        class="flex flex-col items-center gap-1 text-[10px] font-mono text-gray-400 hover:text-white focus:outline-none">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span>Laudo</span>
      </button>
    </nav>

    <!-- Home Indicator do iPhone -->
    <div class="home-indicator" onclick="resetNewTriage()"></div>
  </div>

  <!-- Modal Seletor de Hardware BLE Interoperável (Requisito 1) -->
  <div id="bleDeviceModal"
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-card max-w-xs w-full rounded-2xl p-5 border-bio-lime/30 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="bluetooth" class="w-4 h-4 text-bio-lime"></i>
          Dispositivos BLE Suportados
        </h3>
        <button onclick="closeBleSelectorModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-2">
        <button onclick="selectBleDevice('ESP32 Testbed')"
          class="w-full text-left p-3 rounded-xl bg-space-900 hover:bg-space-850 border border-white/10 hover:border-bio-lime/50 transition-all flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-white">ESP32 Testbed</div>
            <div class="text-[10px] text-gray-400 font-mono">GATT Standard Custom Profile</div>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-400"></i>
        </button>

        <button onclick="selectBleDevice('Oxímetro / Glicosímetro BLE Commercial')"
          class="w-full text-left p-3 rounded-xl bg-space-900 hover:bg-space-850 border border-white/10 hover:border-bio-lime/50 transition-all flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-white">Oxímetro / Glicosímetro BLE</div>
            <div class="text-[10px] text-gray-400 font-mono">BLE SIG Standard Health Profile</div>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-400"></i>
        </button>

        <button onclick="selectBleDevice('OrbiPen Bio-MEMS (Simulado)')"
          class="w-full text-left p-3 rounded-xl bg-space-900 hover:bg-space-850 border border-bio-lime/30 hover:border-bio-lime transition-all flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-bio-lime">OrbiPen Bio-MEMS</div>
            <div class="text-[10px] text-gray-400 font-mono">Driver Óptico 400-900nm + Microagulha 0.2mm</div>
          </div>
          <i data-lucide="check" class="w-3.5 h-3.5 text-bio-lime"></i>
        </button>
      </div>

      <p class="text-[10px] text-gray-400 text-center font-mono">
        Arquitetura compatível com Bluetooth 5.3 Low Energy
      </p>
    </div>
  </div>

  <!-- JavaScript do Protótipo Móvel -->
  <script src="js/mobile-prototype.js"></script>
</body>

</html>
